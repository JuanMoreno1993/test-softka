serenity {
  project.name = "Sauce Demo - Prueba E2E flujo de compra"
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
  report.encoding = UTF-8
}

webdriver {
  driver = chrome
  base.url = "https://www.saucedemo.com"
  wait.for.timeout = 10000
  timeouts.implicitlywait = 5000

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "incognito", "disable-infobars", "disable-notifications",
              "disable-gpu", "no-sandbox", "disable-dev-shm-usage", "remote-allow-origins=*"]
      # Evita el popup de Google Password Manager ("Cambia tu contraseña") que
      # aparece al iniciar sesión con credenciales públicas como secret_sauce
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
        "profile.password_manager_leak_detection" = false
      }
    }
  }
}

# Ejecutar sin interfaz gráfica: mvn clean verify -Dheadless.mode=true
headless.mode = false
